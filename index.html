<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wogoro Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --card: rgba(30, 30, 40, 0.6);
            --border: rgba(157, 78, 221, 0.2);
            --primary: #9d4edd;
            --primary-light: #c77dff;
            --green: #10b981;
            --text: #ffffff;
            --hint: #8b8b9e;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at top, #1a0b2e 0%, #09090b 60%); color: var(--text); margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        .screen { display: none; height: 100%; flex-direction: column; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #c77dff, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Вкладки категорий */
        .category-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .cat-btn { flex: 1; padding: 12px; text-align: center; background: var(--card); border-radius: 12px; font-weight: bold; cursor: pointer; border: 1px solid transparent; transition: 0.3s; backdrop-filter: blur(10px); }
        .cat-btn.active { background: rgba(157, 78, 221, 0.2); border-color: var(--primary); color: var(--primary-light); box-shadow: 0 0 15px rgba(157, 78, 221, 0.3); }

        /* Карточки */
        .card { background: var(--card); backdrop-filter: blur(15px); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0,0,0,0.4); transition: 0.2s;}
        .card:active { transform: scale(0.98); }
        .card-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; }
        .card-desc { font-size: 13px; color: var(--hint); margin-bottom: 15px; line-height: 1.4;}
        .prices { display: flex; gap: 10px; margin-bottom: 15px;}
        .price-badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid rgba(16, 185, 129, 0.3);}
        .price-badge-stars { background: rgba(157, 78, 221, 0.15); color: var(--primary-light); border-color: rgba(157, 78, 221, 0.3);}
        .buy-btn { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);}
        .buy-btn:active { transform: scale(0.97); }

        /* Профиль */
        .profile-header { text-align: center; margin-bottom: 25px; }
        .avatar { width: 80px; height: 80px; background: linear-gradient(135deg, #7b2cbf, #c77dff); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);}
        .balance-card { background: var(--card); backdrop-filter: blur(15px); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid var(--border); margin-bottom: 20px; }
        .balance-val { font-size: 36px; font-weight: bold; color: var(--green); text-shadow: 0 0 15px rgba(16, 185, 129, 0.3); margin: 10px 0;}
        
        .order-item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--primary); backdrop-filter: blur(10px);}
        .order-title { font-weight: bold; color: var(--text); margin-bottom: 5px;}
        .order-desc { font-size: 12px; color: var(--hint);}

        /* Всплывающее окно (Modal) оплаты */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; display: none; justify-content: center; align-items: flex-end; }
        .modal-content { background: #14141a; width: 100%; border-radius: 24px 24px 0 0; padding: 25px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-top: 1px solid var(--border);}
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; box-sizing: border-box; font-size: 16px;}
        .input-group input:focus { outline: none; border-color: var(--primary); }
        
        .pay-options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px;}
        .pay-balance { background: var(--green); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer;}
        .pay-stars { background: #f59e0b; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer;}
        .close-modal { background: none; border: none; color: var(--hint); font-size: 14px; margin-top: 15px; cursor: pointer; text-align: center; width: 100%;}

        /* Меню снизу */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(15px); display: flex; border-top: 1px solid var(--border); z-index: 50;}
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--hint); font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--primary-light); font-weight: bold; text-shadow: 0 0 10px rgba(199, 125, 255, 0.4);}
        .nav-item span { font-size: 22px; margin-bottom: 3px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="content">
        <!-- ЭКРАН 1: МАГАЗИН -->
        <div id="screen-shop" class="screen active">
            <div class="header"><h1>👑 Wogoro Shop</h1></div>
            
            <div class="category-tabs">
                <div class="cat-btn active" id="btn-projects" onclick="switchCat('project')">🔥 Проекты</div>
                <div class="cat-btn" id="btn-mods" onclick="switchCat('mod')">🎮 Моды</div>
            </div>
            
            <div id="products-list"></div>
        </div>

        <!-- ЭКРАН 2: ПРОФИЛЬ -->
        <div id="screen-profile" class="screen">
            <div class="header"><h1>👤 Профиль</h1></div>
            <div class="profile-header">
                <div class="avatar" id="prof-avatar">?</div>
                <h2 id="prof-name" style="margin:0;">Загрузка...</h2>
            </div>
            
            <div class="balance-card">
                <div style="color: var(--hint); font-size: 14px;">Ваш баланс</div>
                <div class="balance-val" id="prof-balance">0 ₽</div>
            </div>

            <h3 style="margin-bottom: 15px; color: var(--primary-light);">📜 История покупок</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО ОПЛАТЫ -->
    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="text-align: center; margin-top: 0; color: var(--primary-light);" id="modal-title">Оформление</h2>
            
            <div class="input-group">
                <label>Введите ваш Ник (в игре)</label>
                <input type="text" id="input-nick" placeholder="Например: Misha_Fogin">
            </div>
            
            <div class="input-group">
                <label>Введите Бонус (при старте игры)</label>
                <input type="text" id="input-bonus" placeholder="Например: 100.000$ на руку">
            </div>
            
            <div class="pay-options">
                <button class="pay-balance" onclick="payWithBalance()">💳 Оплатить с баланса</button>
                <button class="pay-stars" onclick="payWithStars()">⭐️ Оплатить Звездами</button>
            </div>
            
            <button class="close-modal" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-shop" onclick="goToTab('shop')"><span>🛍</span> Магазин</div>
        <div class="nav-item" id="nav-profile" onclick="goToTab('profile')"><span>👤</span> Профиль</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;

        // ⚠️ ВСТАВЬ СВОЙ ДОМЕН RAILWAY!
        const API_URL = "https://ТВОЙ_ДОМЕН.up.railway.app/api"; 

        let allProducts = [];
        let currentCategory = 'project';
        let currentProduct = null;

        if (user) {
            document.getElementById('prof-name').innerText = user.first_name;
            document.getElementById('prof-avatar').innerText = user.first_name[0].toUpperCase();
            loadProfile();
        }

        // Загрузка товаров
        fetch(`${API_URL}/products`).then(res => res.json()).then(products => {
            allProducts = products;
            renderProducts();
        });

        function renderProducts() {
            const container = document.getElementById('products-list');
            const filtered = allProducts.filter(p => p.cat === currentCategory);
            
            if (filtered.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--hint);'>В этом разделе пока нет товаров.</p>";
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="card">
                    <div class="card-title">${p.name}</div>
                    <div class="card-desc">${p.desc}</div>
                    <div class="prices">
                        <span class="price-badge">${p.rub} ₽</span>
                        <span class="price-badge price-badge-stars">${p.stars} ⭐️</span>
                    </div>
                    <button class="buy-btn" onclick='openModal(${JSON.stringify(p)})'>Купить</button>
                </div>
            `).join('');
        }

        function switchCat(cat) {
            currentCategory = cat;
            document.getElementById('btn-projects').classList.toggle('active', cat === 'project');
            document.getElementById('btn-mods').classList.toggle('active', cat === 'mod');
            renderProducts();
        }

        function goToTab(tab) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
            if (tab === 'profile') loadProfile();
        }

        // Загрузка профиля
        function loadProfile() {
            fetch(`${API_URL}/user/${user.id}`).then(res => res.json()).then(data => {
                document.getElementById('prof-balance').innerText = data.balance + " ₽";
                const history = document.getElementById('history-list');
                if (data.orders.length === 0) {
                    history.innerHTML = "<p style='color: var(--hint); font-size: 14px;'>Вы пока ничего не покупали.</p>";
                } else {
                    history.innerHTML = data.orders.map(o => `
                        <div class="order-item">
                            <div class="order-title">${o.name}</div>
                            <div class="order-desc">🎮 Ник: ${o.nick} | 🎁 Бонус: ${o.bonus}<br>📅 ${o.date}</div>
                        </div>
                    `).join('');
                }
            });
        }

        // Модальное окно
        function openModal(product) {
            currentProduct = product;
            document.getElementById('modal-title').innerText = "Покупка: " + product.name;
            document.getElementById('checkout-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('checkout-modal').classList.remove('active');
        }

        function payWithBalance() {
            const nick = document.getElementById('input-nick').value;
            const bonus = document.getElementById('input-bonus').value;
            if (!nick || !bonus) return tg.showAlert("⚠️ Пожалуйста, заполните Ник и Бонус!");

            fetch(`${API_URL}/pay_balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id, product_id: currentProduct.id, nickname: nick, bonus: bonus })
            })
            .then(res => res.json()).then(data => {
                if (data.success) {
                    tg.showAlert(`✅ Успешно куплено!\nТовар: ${currentProduct.name}\n\nСвяжитесь с @Wogoro для получения.`);
                    closeModal();
                    loadProfile(); // Обновляем баланс и историю
                } else {
                    tg.showAlert(data.error);
                }
            });
        }

        function payWithStars() {
            const nick = document.getElementById('input-nick').value;
            const bonus = document.getElementById('input-bonus').value;
            if (!nick || !bonus) return tg.showAlert("⚠️ Пожалуйста, заполните Ник и Бонус!");

            tg.sendData(JSON.stringify({ 
                action: "buy_stars", 
                product_name: currentProduct.name,
                nickname: nick, 
                bonus: bonus 
            }));
            tg.close();
        }
    </script>
</body>
</html>
