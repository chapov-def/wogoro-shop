<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wogoro Shop</title>
    <!-- Подключаем скрипт Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #888; font-size: 14px; margin-top: 0; margin-bottom: 20px;}
        .card {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #3a3a3a;
        }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #fff;}
        .card-desc { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px;}
        .price { font-size: 16px; font-weight: bold; color: #4ade80; }
        .buy-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>👑 Wogoro Black Russia</h1>
    <p class="subtitle">Качественные проекты и моды</p>

    <!-- Карточка 1 -->
    <div class="card">
        <div class="card-title">BLACK RUSSIA ULTRA</div>
        <div class="card-desc">Полный проект с лаунчером и обновлениями</div>
        <div class="price-row">
            <div class="price">200 💸 / 100 ⭐️</div>
            <button class="buy-btn" onclick="buy('ULTRA')">Купить</button>
        </div>
    </div>

    <!-- Карточка 2 -->
    <div class="card">
        <div class="card-title">BLACK RUSSIA PRO</div>
        <div class="card-desc">Проект с мини-обновлениями</div>
        <div class="price-row">
            <div class="price">150 💸 / 85 ⭐️</div>
            <button class="buy-btn" onclick="buy('PRO')">Купить</button>
        </div>
    </div>

    <!-- Карточка 3 -->
    <div class="card">
        <div class="card-title">BLACK RUSSIA NEW</div>
        <div class="card-desc">Качественный мод</div>
        <div class="price-row">
            <div class="price">100 💸 / 65 ⭐️</div>
            <button class="buy-btn" onclick="buy('NEW')">Купить</button>
        </div>
    </div>

    <script>
        // Инициализация приложения
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Функция при нажатии на кнопку "Купить"
        function buy(product) {
            // Отправляем данные боту (он покажет менеджера)
            tg.sendData(JSON.stringify({ action: "buy", product: product }));
            // Закрываем мини-апп
            tg.close(); 
        }
    </script>
</body>
</html>
